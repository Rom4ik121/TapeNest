# Dev edge proxy. Upstreams are resolved lazily (variables + Docker DNS), so
# nginx starts even before api-gateway/streaming-service exist (stage 1+).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  # Signed audio/cover links (music-service via the gateway, ADR 0009): stream
  # through without buffering; Range/If-Range pass by default.
  location /api/v1/stream/ {
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Telegram webhook → bot-service (secret_token checked by the service)
  location /tg/ {
    set $bot http://bot-service:8081;
    proxy_pass $bot;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /hls/ {
    set $streaming http://streaming-service:8094;
    proxy_pass $streaming;
    proxy_buffering off;
  }

  # Presigned MinIO links for downloads > 50 MB (ADR 0008). Host must stay the
  # public one: it is part of the S3 V4 signature.
  location /media/ {
    set $minio http://minio:9000;
    proxy_pass $minio;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # CineNest mini app under /cinenest/ (ADR 0007): Vite dev server on the host
  # (apps/cinenest: npm run dev, base /cinenest/). In prod: static dist/ here.
  location /mediahub/ {
    proxy_pass http://host.docker.internal:5175;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location /video-edits/ {
    set $minio http://minio:9000;
    proxy_pass $minio;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /photos/ {
    set $minio http://minio:9000;
    proxy_pass $minio;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location /cinenest/ {
    proxy_pass http://host.docker.internal:5174;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # Vite dev server running on the host (apps/waveplayer: npm run dev)
  location / {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}

<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16141C" />
    <title>WavePlayer — TapeNest</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23EEAA11'/%3E%3Cstop offset='.5' stop-color='%23BB3381'/%3E%3Cstop offset='1' stop-color='%233F1D50'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6 17c2-5 4-5 6 0s4 5 6 0 4-5 6 0' stroke='%23E7E4DE' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Pick the theme before first paint to avoid a flash (Telegram passes
      // tgWebAppThemeParams in the URL hash; fallback: prefers-color-scheme).
      (function () {
        try {
          var d = document.documentElement, dark;
          var m = /tgWebAppThemeParams=([^&]+)/.exec(location.hash);
          if (m) {
            var tp = JSON.parse(decodeURIComponent(m[1]));
            var bg = (tp.bg_color || '').replace('#', '');
            if (bg.length === 6) {
              var r = parseInt(bg.substr(0, 2), 16), g = parseInt(bg.substr(2, 2), 16), b = parseInt(bg.substr(4, 2), 16);
              dark = (0.299 * r + 0.587 * g + 0.114 * b) < 128;
            }
          }
          if (dark === undefined) dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          d.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

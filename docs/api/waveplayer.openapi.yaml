openapi: 3.1.0
info:
  title: TapeNest WavePlayer API
  version: 1.1.0
  description: >-
    Contract between apps/waveplayer and api-gateway/music-service. See waveplayer-contract.md.
    Auth endpoints are implemented by api-gateway (stage 1) — full details, error codes and
    /auth/logout, /me in gateway.openapi.yaml. Music endpoints are implemented by music-service
    (stage 3, ADR 0009); the gateway forwards them unchanged with the user identity.
    1.1.0 adds the signed media routes /stream/* (no bearer: <audio>/<img> cannot send one),
    the degraded 503 of stream-url and explicit 400/404 responses. Errors: {message, code, service?}.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearer: []
paths:
  /auth/telegram:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [initData], properties: { initData: { type: string } } } } } }
      responses:
        '200': { description: JWT pair, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses:
        '200': { description: JWT pair, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /tracks/recent: { get: { parameters: [ { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { $ref: '#/components/responses/TrackPage' } } } }
  /tracks/popular: { get: { parameters: [ { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { $ref: '#/components/responses/TrackPage' } } } }
  /tracks/liked: { get: { parameters: [ { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/limit' } ], responses: { '200': { $ref: '#/components/responses/TrackPage' } } } }
  /tracks/search:
    get:
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses: { '200': { $ref: '#/components/responses/TrackPage' } }
  /tracks/{id}/stream-url:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      description: >-
        Signed, short-lived (≤ 1 h) audio URL, usually relative to the API origin
        (/api/v1/stream/tracks/{id}?exp&u&sig). 503 SERVICE_UNAVAILABLE with service "streaming"
        (header X-Degraded-Dependency: navidrome, Retry-After) when the audio backend is down —
        the catalog keeps working.
      responses:
        '200': { description: signed URL, content: { application/json: { schema: { $ref: '#/components/schemas/StreamUrl' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Degraded' }
  /stream/tracks/{id}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: exp, in: query, required: true, schema: { type: integer }, description: unix expiry }
      - { name: u, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: sig, in: query, required: true, schema: { type: string }, description: HMAC-SHA256 (base64url) }
      - { name: Range, in: header, required: false, schema: { type: string }, example: bytes=0- }
    get:
      security: []
      description: Original audio file (no transcoding) with HTTP Range support. Obtain the URL from stream-url.
      responses:
        '200': { description: whole file, headers: { Accept-Ranges: { schema: { type: string } } }, content: { audio/*: { schema: { type: string, format: binary } } } }
        '206': { description: partial content, headers: { Content-Range: { schema: { type: string } } }, content: { audio/*: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Degraded' }
    head:
      security: []
      responses:
        '200': { description: headers only }
        '403': { description: bad or expired signature }
  /stream/covers/{id}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: size, in: query, required: true, schema: { type: integer, minimum: 16, maximum: 1200 } }
      - { name: sig, in: query, required: true, schema: { type: string } }
    get:
      security: []
      description: Cover art (signed, no expiry → Cache-Control public, immutable). URLs come from Track.coverUrl.
      responses:
        '200': { description: image, content: { image/*: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { description: no cover }
  /tracks/{id}/like:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post: { responses: { '204': { description: liked } } }
    delete: { responses: { '204': { description: unliked } } }
  /tracks/{id}/position:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      responses:
        '200': { description: saved position, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackPosition' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [positionSec], properties: { positionSec: { type: number, minimum: 0 } } } } } }
      responses: { '204': { description: saved } }
  /playlists:
    get:
      responses: { '200': { description: list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Playlist' } } } } } }
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TitleBody' } } } }
      responses:
        '200': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /playlists/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      responses:
        '200': { description: playlist, content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistWithTracks' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TitleBody' } } } }
      responses: { '200': { description: renamed, content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } } } }
    delete: { responses: { '204': { description: deleted } } }
  /playlists/{id}/tracks:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [trackId], properties: { trackId: { type: string } } } } } }
      responses: { '204': { description: added } }
  /playlists/{id}/tracks/{trackId}:
    parameters: [ { $ref: '#/components/parameters/id' }, { name: trackId, in: path, required: true, schema: { type: string } } ]
    delete: { responses: { '204': { description: removed } } }
  /wave/sessions:
    post:
      description: >-
        Starts My Wave. Batches come from reco-service (personal taste profile, collaborative filtering,
        audio features; ADR 0010); when reco is disabled, slow or its breaker is open music-service serves
        the ADR 0009 §6 heuristic instead (`strategy: fallback`). The body is optional (older clients send none).
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { mode: { $ref: '#/components/schemas/WaveMode' } } } } }
      responses:
        '200':
          description: session
          headers: { X-Wave-Strategy: { schema: { type: string, enum: [reco, fallback] } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WaveSession' } } }
        '400': { $ref: '#/components/responses/Error' }
  /wave/sessions/{id}/tracks:
    parameters: [ { $ref: '#/components/parameters/id' }, { name: after, in: query, required: true, schema: { type: string } } ]
    get:
      responses:
        '200':
          description: next batch (tracks carry `reason`)
          headers: { X-Wave-Strategy: { schema: { type: string, enum: [reco, fallback] } } }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WaveTrack' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /wave/sessions/{id}/feedback:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [trackId, action], properties: { trackId: { type: string }, action: { type: string, enum: [like, skip] } } } } } }
      responses: { '204': { description: accepted } }
  /events/track-listened:
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [trackId, positionSec, completed], properties: { trackId: { type: string }, positionSec: { type: number }, completed: { type: boolean } } } } } }
      responses: { '204': { description: accepted } }
  /events/track-skipped:
    post:
      description: >-
        The user left a track before the listen event (≥ 50 %). Feeds reco-service's taste profile
        (early skip < 30 s is a strong negative signal); never written to play_events.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [trackId, positionSec], properties: { trackId: { type: string }, positionSec: { type: number, minimum: 0 } } } } } }
      responses:
        '204': { description: accepted }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    cursor: { name: cursor, in: query, required: false, schema: { type: string } }
    limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Error: { description: error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TrackPage: { description: page of tracks, content: { application/json: { schema: { $ref: '#/components/schemas/TrackPage' } } } }
    Degraded:
      description: a dependency behind music-service is down (streaming); retry later
      headers:
        X-Degraded-Dependency: { schema: { type: string, example: navidrome } }
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error: { type: object, required: [message], properties: { message: { type: string }, code: { type: string }, service: { type: string } } }
    User:
      type: object
      required: [id, telegramId, firstName, lastName, username, photoUrl, languageCode]
      properties:
        id: { type: string, format: uuid }
        telegramId: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: [string, 'null'] }
        username: { type: [string, 'null'] }
        photoUrl: { type: [string, 'null'] }
        languageCode: { type: [string, 'null'] }
        role: { type: string, enum: [user, admin], description: added by api-gateway }
    AuthTokens: { type: object, required: [accessToken, refreshToken, user], properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresIn: { type: integer, description: 'seconds (added by api-gateway, optional for clients)' }, user: { $ref: '#/components/schemas/User' } } }
    Track:
      type: object
      required: [id, title, artist, album, coverUrl, durationSec, liked]
      properties:
        id: { type: string }
        title: { type: string }
        artist: { type: string }
        album: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'], description: 'signed /api/v1/stream/covers/... URL (relative to the API origin) or null' }
        durationSec: { type: number }
        liked: { type: boolean }
    TrackPage: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Track' } }, nextCursor: { type: [string, 'null'] } } }
    Playlist: { type: object, required: [id, title, trackCount, createdAt], properties: { id: { type: string }, title: { type: string }, trackCount: { type: integer }, createdAt: { type: string, format: date-time } } }
    PlaylistWithTracks: { type: object, required: [playlist, tracks], properties: { playlist: { $ref: '#/components/schemas/Playlist' }, tracks: { type: array, items: { $ref: '#/components/schemas/Track' } } } }
    WaveSession:
      type: object
      required: [sessionId, tracks]
      properties:
        sessionId: { type: string }
        tracks: { type: array, items: { $ref: '#/components/schemas/WaveTrack' } }
        strategy: { type: string, enum: [reco, fallback], description: 'reco-service or the local heuristic (ADR 0010)' }
        mode: { $ref: '#/components/schemas/WaveMode' }
    WaveMode: { type: string, enum: [default, calm, energetic, discover, favorites], default: default }
    WaveTrack:
      description: Track plus an optional explanation of why the wave picked it.
      allOf:
        - { $ref: '#/components/schemas/Track' }
        - type: object
          properties:
            reason: { oneOf: [ { $ref: '#/components/schemas/WaveReason' }, { type: 'null' } ] }
    WaveReason:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: clients must ignore unknown kinds
          enum: [because_you_liked, artist_you_like, genre_you_like, mood_you_like, similar_listeners, popular, new_in_catalog, discovery, favorite, session_artist]
        refTrackId: { type: string, description: because_you_liked — the liked track this pick is similar to }
        refTitle: { type: string }
        refArtist: { type: string }
        artist: { type: string }
        genre: { type: string }
        tag: { type: string, description: 'mood tag from audio analysis: energetic, calm, fast, slow, bright, warm, major, minor' }
    StreamUrl: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string, format: date-time } } }
    PlaybackPosition: { type: object, required: [trackId, positionSec, updatedAt], properties: { trackId: { type: string }, positionSec: { type: number }, updatedAt: { type: string, format: date-time } } }
    TitleBody: { type: object, required: [title], properties: { title: { type: string, minLength: 1, maxLength: 100 } } }
